# Central version catalog. Kept in step with govee-android and recall-android so
# all three build under the same nix `#android` devshell.
[versions]
agp = "8.13.0"
kotlin = "2.4.0"
junit = "4.13.2"
# Compose, for the app's screen. The probe deliberately has none — see :app's
# build script — but #785 is a phone app someone looks at, not a logcat stream.
activity-compose = "1.11.0"
compose-bom = "2025.09.00"
lifecycle = "2.9.4"
core-ktx = "1.17.0"
# org.json, for the thoth HTTP contract. NOT a runtime dependency: Android has this
# package in the boot classpath, so :protocol compiles against the artifact and the
# platform supplies it on the device. See :protocol's build script.
json = "20250107"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
json = { group = "org.json", name = "json", version.ref = "json" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# The protocol module is a plain JVM library so its tests run without a device.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
